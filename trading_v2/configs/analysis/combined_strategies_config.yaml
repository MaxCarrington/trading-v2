# Combined portfolio: S&P ETF core + month-end overlay + H27 (USD into month end) + pre-FOMC S&P drift
# Data rules: research 2005-2018 | validation 2019-2022 (a few looks) | holdout 2023-2026 (once)
# All rules and sizes below were fixed BEFORE the first run.
start_date: "2005-01-01"
end_date: "2018-12-31"
starting_capital: 10000

# --- S&P ETF core (same as sp_etf_core) ---
etf_file: long_history/SPY.csv          # Yahoo SPY; "Adj Close" includes dividends
etf_cost_%: 0.07                         # yearly ETF fee
trend_ma_days: 200                       # the filtered core holds the ETF only above this average
switch_cost_%: 0.05                      # cost each time the filtered core buys or sells the ETF
rates_file: rates/USD.csv                # FRED 3-month rate, used one month late

# --- month-end overlay (same as sp_etf_core) ---
month_end_trades: results/month_end_stocks_bonds/SPX500_USD_DE30_EUR_UK100_GBP_CH20_CHF_2005_2026_none/trades.csv
markets: 4                               # each month-end market gets 1/4 of the account
financing_markup_%: 2.5                  # OANDA CFD financing = USD rate + this, per night

# --- H27: buy USD from the signal day to month end when stocks lag bonds by 2%+ ---
h27_pairs: [EUR_USD, GBP_USD, USD_JPY]
h27_usd_sign: {EUR_USD: -1, GBP_USD: -1, USD_JPY: 1}   # +1 when the pair rises as USD gains
h27_stock: SPX500_USD
h27_bond: USB30Y_USD
h27_days_before: 4                       # signal day = 4 trading days before the month's last trading day
h27_threshold_%: 2.0                     # fires when stock MTD - bond MTD <= -2%
h27_size: 1.0                            # total notional as a multiple of the account, split equally over the pairs
slippage_pips: 0.3                       # FX costs from the shared helper: spread + slippage + swap
swap_markup_%: 1.5

# --- Pre-FOMC drift: long the S&P CFD from the close before a scheduled Fed announcement to the announcement-day close ---
fomc_file: fomc_dates.csv
fomc_symbol: SPX500_USD
fomc_size: 1.0                           # notional as a multiple of the account
spx_spread_points: 0.5                   # median OANDA SPX500 spread 2016-18
spx_slippage_points: 0.3                 # per side
n_tests: 41                              # ideas tested so far (for the luck-proof t bar)
