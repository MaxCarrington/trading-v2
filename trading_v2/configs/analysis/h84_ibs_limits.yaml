# H84: low close in the day's range (IBS) with limit entries (notebooks/hypotheses/h84_ibs_limits.ipynb), research only
start_year: 2005          # research period. Do not change to 2019+ until the rules are frozen.
end_year: 2018
slippage_%: 0.005           # per side, on top of half of OANDA's spread each side
financing_markup_%: 2.5   # CFD financing per night held: longs pay rate + 2.5%, shorts receive rate - 2.5%
train_years: 4            # walk-forward: pick the setting with the best net t over the previous 4 years
n_tests: 72               # ideas tested so far, for the luck-proof bar
random_runs: 300
ftmo_leverages: [1, 2, 3, 5, 10]   # position size as a multiple of the account, split across the markets
fill_through_%: 0.005
limit_window_minutes: 30
trend_days: 200
sessions:
  SPX500_USD: [ny, "09:30", "16:00"]
  DE30_EUR: [frankfurt, "09:00", "17:30"]
  UK100_GBP: [london, "08:00", "16:30"]
grid:
  ibs_max: [0.1, 0.2, 0.3]
  limit_offset_pct: [0.02, 0.05, 0.1]
base:
  ibs_max: 0.2
  limit_offset_pct: 0.05
