# H93 bond month-end VALIDATION 2019-2022 (notebooks/hypotheses/h93_bond_month_end_validation.ipynb). Run ONCE.
# Rule frozen 2026-10-23 (research/reddit_mining/bond_month_end_spec.md), research 2005-18: portfolio +0.18%/month, t 3.01, 12/14 yrs.
start_year: 2019
end_year: 2022
days_before: 4                 # buy at the close 4 trading days before the last trading day of the month
instruments:                   # equal weight
  TIP: {source: ibkr}
  LQD: {source: ibkr}
  USB30Y_USD: {source: oanda}  # long Treasury price (stands in for TLT)
cost_round_trip_%: 0.08        # ETF: commission + spread + slippage
validation_bar:                # set before running
  min_t: 1.0                   # with 48 months a real edge of the research size gives t ~1.6
  min_years_positive: 3        # of 4
research_reference:
  portfolio_%_per_month: 0.18
  t: 3.01
  years_positive: "12/14"
