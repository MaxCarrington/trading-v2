# H12: Turtle breakouts
# Data rules: research 2005-2018 | validation 2019-2022 (a few looks) | final holdout 2023-2026 (once)
symbols: [EUR_USD, GBP_USD, AUD_USD, NZD_USD, USD_CAD, USD_CHF, USD_JPY,
          EUR_GBP, EUR_JPY, GBP_JPY, EUR_CHF, AUD_JPY, EUR_AUD, AUD_NZD]
timeframe: D
years: [2005, 2006, 2007, 2008, 2009, 2010, 2011, 2012, 2013, 2014, 2015, 2016, 2017, 2018]   # research period only
entry: 55              # base variant: buy a 55-day high close
exit: 20               # base variant: exit at a 20-day low close
use_stop: false        # base variant: no ATR stop
entry_exit_options: [[20, 10], [55, 20]]
stop_options: [false, true]
atr_stop: 2            # stop = 2 x ATR(20) from entry
train_years: 2

# Costs (OANDA core pricing)
core_spread_pips:      # website "from" spreads; AUD_JPY, EUR_CHF, EUR_AUD, AUD_NZD aren't listed (my guesses)
  EUR_USD: 0.1
  GBP_USD: 0.1
  AUD_USD: 0.3
  NZD_USD: 0.4
  USD_CAD: 0.3
  USD_CHF: 0.1
  USD_JPY: 0.1
  EUR_GBP: 0.2
  EUR_JPY: 0.6
  GBP_JPY: 0.3
  EUR_CHF: 0.5
  AUD_JPY: 0.6
  EUR_AUD: 0.6
  AUD_NZD: 0.8
spread_markup_pips: 0.2     # typical spread is wider than the "from" spread
commission_%: 0.003         # per side, % of trade size
slippage_pips: 0.3          # on entry and on exit
swap_markup_%: 1.5          # OANDA's financing markup, % a year (my estimate)
