# H76: turn-of-the-month drift (unconditional) (notebooks/hypotheses/h76_turn_of_month.ipynb), research only
start_year: 2005          # research period. Do not change to 2019+ until the rules are frozen.
end_year: 2018
slippage_%: 0.01           # per side, on top of half of OANDA's spread each side
financing_markup_%: 2.5   # CFD financing per night held: longs pay rate + 2.5%, shorts receive rate - 2.5%
train_years: 4            # walk-forward: pick the setting with the best net t over the previous 4 years
n_tests: 60               # ideas tested so far, for the luck-proof bar
random_runs: 300
ftmo_leverages: [1, 2, 3, 5, 10]   # position size as a multiple of the account, split across the markets
symbols: [SPX500_USD, DE30_EUR, UK100_GBP, CH20_CHF]
grid:
  entry_day: [-3, -2, -1]   # close of the 3rd last / 2nd last / last trading day
  exit_day: [2, 3, 4]       # close of the 2nd / 3rd / 4th trading day of the next month
base:
  entry_day: -2
  exit_day: 3
