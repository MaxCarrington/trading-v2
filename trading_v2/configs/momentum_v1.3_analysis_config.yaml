# Backtest configuration for the version 1.3 of the momentum strategy

strategy: "momentum_v1.3"

provider: "OANDA"
security_type: "forex"
starting_capital: 10000

symbols:
  - "AUD_USD"
  - "EUR_USD"
  - "GBP_USD"
  - "NZD_USD"
  - "USD_CAD"
  - "USD_CHF"
  #- "USD_JPY"

timeframe: "H1"
start_date: "01-01"
end_date: "04-02"
year: "2024"

parameters:
  momentum_lookback:
    AUD_USD: 12
    EUR_USD: 12
    GBP_USD: 12
    NZD_USD: 12
    USD_CAD: 12
    USD_CHF: 12
    #USD_JPY: 12
  lookback:
    AUD_USD: 12
    EUR_USD: 12
    GBP_USD: 12
    NZD_USD: 12
    USD_CAD: 12
    USD_CHF: 12
    #USD_JPY: 12
  rsi_lookback:
    AUD_USD: 12
    EUR_USD: 12
    GBP_USD: 12
    NZD_USD: 12
    USD_CAD: 12
    USD_CHF: 12
    #USD_JPY: 12
  ma_lookback:
    AUD_USD: 12
    EUR_USD: 12
    GBP_USD: 12
    NZD_USD: 12
    USD_CAD: 12
    USD_CHF: 12
    #USD_JPY: 12
  ma_thresh:
    AUD_USD: 0.66
    EUR_USD: 0.66
    GBP_USD: 0.66
    NZD_USD: 0.66
    USD_CAD: 0.66
    USD_CHF: 0.66
    #USD_JPY: 0.66
  overbought_thresh:
    AUD_USD: 76
    EUR_USD: 76
    GBP_USD: 76
    NZD_USD: 76
    USD_CAD: 76
    USD_CHF: 76
    #USD_JPY: 76
  oversold_thresh:
    AUD_USD: 27
    EUR_USD: 27
    GBP_USD: 27
    NZD_USD: 27
    USD_CAD: 27
    USD_CHF: 27
    #USD_JPY: 27
  momentum_len_thresh:
    AUD_USD: 0.77
    EUR_USD: 0.77
    GBP_USD: 0.77
    NZD_USD: 0.77
    USD_CAD: 0.77
    USD_CHF: 0.77
    #USD_JPY: 0.77
  momentum_score_thresh:
    AUD_USD: 70
    EUR_USD: 70
    GBP_USD: 70
    NZD_USD: 70
    USD_CAD: 70
    USD_CHF: 70
    #USD_JPY: 70
  ma_type: "EMA"
  momentum_wSize:
    AUD_USD: 15
    EUR_USD: 15
    GBP_USD: 15
    NZD_USD: 15
    USD_CAD: 15
    USD_CHF: 15
    #USD_JPY: 5
  p_val_len_thresh:
    AUD_USD: 0.97
    EUR_USD: 0.97
    GBP_USD: 0.97
    NZD_USD: 0.97
    USD_CAD: 0.97
    USD_CHF: 0.97
    #USD_JPY: 0.97
  max_holding_duration:
    AUD_USD: 50
    EUR_USD: 50
    GBP_USD: 50
    NZD_USD: 50
    USD_CAD: 50
    USD_CHF: 50
    #USD_JPY: 50

  # Signal type to use
  signal_type: "donchian"          # or "correlation" for the existing score
  donchian_lookback: 20            # bars; tune this

  # Risk management
  position_size_type: "risk_based"
  position_size: 1000             # ← add (unused when type=risk_based, but validator wants it)
  risk_per_trade: 0.005
  max_position_size: 5000
  max_open_positions: 1           # ← add (used to cap concurrent trades; 1 = strict one-x

  # ATR-based stop loss
  stop_loss_type: "atr"
  stop_loss_value: 2.0       # 2.0 = stop at 2× ATR from entry

  # Take profit can stay percentage-based for now
  take_profit_type: "atr"
  take_profit_value: 3.0

  atr_lookback: 14           # standard
