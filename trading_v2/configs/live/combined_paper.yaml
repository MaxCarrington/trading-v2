# Paper trading month-end + RSI(2) together in one OANDA practice account (scripts/paper_combined.py)
# Sizes = the FTMO pick from H178 (month-end 0.6, RSI(2) 1.0). Normal account tested 1.5 + 1.5.
atr_days: 10           # ATR = average true range of the last 10 daily bars (both stops)
month_end:
  markets:
    - {stock: "SPX500_USD", bond: "USB30Y_USD", calendar: "NYSE"}
    - {stock: "DE30_EUR",   bond: "DE10YB_EUR", calendar: "XETRA"}
    - {stock: "UK100_GBP",  bond: "UK10YB_GBP", calendar: "LSE"}
    - {stock: "CH20_CHF",   bond: "DE10YB_EUR", calendar: "SIX"}   # Bund: Swiss yields aren't available live
  threshold: 0.02      # 2% month-to-date gap between stocks and bonds
  days_before: 4       # signal day = 4 trading days before the last trading day of the month
  days_after: 3        # "after" trades exit at the close of the 3rd trading day of next month
  leverage: 0.6        # each market gets 0.6 / 4 of the account
  stop_atr: 2          # stop 2 x ATR below the entry
rsi2:
  symbols: [SPX500_USD, NAS100_USD, US30_USD, US2000_USD, DE30_EUR, UK100_GBP, FR40_EUR, EU50_EUR, JP225_USD, AU200_AUD, HK33_HKD, CH20_CHF]
  entry_rsi: 10        # buy below 10, sell short above 90
  exit_rsi: 50
  trend_days: 200
  max_hold: 10         # trading days
  leverage: 1.0        # each market gets 1 / 12 of the account
  stop_atr: 3          # stop 3 x ATR from the entry
output_dir: "results/paper_combined"
