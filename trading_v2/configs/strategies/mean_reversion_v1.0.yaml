# Mean reversion strategy v1.0 config file
# Run with: python scripts/run_backtest.py --config mean_reversion_v1.0.yaml

strategy: "momentum_v1.0"

provider: "OANDA"
security_type: "forex"
starting_capital: 1000

symbols:
  - "AUD_USD"
  - "EUR_USD"
  - "GBP_USD"
  - "NZD_USD"
  - "USD_CAD"
  - "USD_CHF"
  #- "USD_JPY"

timeframe: "H1"
start_date: "02-01"
end_date: "03-01"
year: "2025"

parameters:

  # Risk management
  max_open_positions: 1
  position_size_type: "fixed"
  position_size: 1000

  # ATR-based stop loss
  stop_loss_type: "atr"
  stop_loss_value: 2.0       # 2.0 = stop at 2× ATR from entry

  # Take profit can stay percentage-based for now
  take_profit_type: "atr"
  take_profit_value: 5.0

  atr_lookback: 14           # standard
