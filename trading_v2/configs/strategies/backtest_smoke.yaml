# Smoke-test backtest configuration.
# Minimal run used to verify a fresh install works end-to-end.
# Run with: python scripts/run_backtest.py --config configs/backtest_smoke.yaml

strategy: "momentum_v1.2"

provider: "OANDA"
security_type: "forex"
starting_capital: 1000

symbols:
  - "AUD_USD"

timeframe: "D"
start_date: "2025"
end_date: "2025"
year: "2025"

parameters:
  momentum_lookback: 12
  lookback:
    AUD_USD: 12
  rsi_lookback:
    AUD_USD: 12
  ma_lookback:
    AUD_USD: 9
  ma_thresh:
    AUD_USD: 0.66
  overbought_thresh:
    AUD_USD: 76
  oversold_thresh:
    AUD_USD: 27
  momentum_len_thresh:
    AUD_USD: 0.77
  momentum_score_thresh:
    AUD_USD: 65
  ma_type: "EMA"
  momentum_wSize:
    AUD_USD: 15
  p_val_len_thresh:
    AUD_USD: 0.97

  # Risk management
  stop_loss_type: "pct"
  stop_loss_value: 0.01
  take_profit_type: "pct"
  take_profit_value: 0.02
  max_open_positions: 1
  position_size_type: "fixed"
  position_size: 1000
