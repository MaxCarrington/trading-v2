# FTMO's 58 stock CFDs (ftmo.com/en/symbols, Equities CFD tab, 7 Nov 2026): daily IBKR history for research
# Run: PYTHONPATH=src python scripts/ibkr_download.py data/ibkr_download_ftmo_stocks.yaml
# Needs IB Gateway running and logged in (paper is fine). Read-only: no orders.
# adjusted: true asks IBKR for dividend- and split-adjusted prices (ADJUSTED_LAST). IBKR only serves these in one
# request ending today, but the script saves only start_year..end_year, so nothing after 2018 is written.
# Stocks that listed after 2018 (ZM, PLTR, SNOW, ARM, SPCX) will simply have no files.
host: 127.0.0.1
port: 4002                # IB Gateway paper = 4002, live = 4001 (TWS: paper 7497, live 7496)
client_id: 12
start_year: 2004          # one warm-up year for the 200-day average
end_year: 2018            # research years only
bar_size: 1 day
timeframe: D
adjusted: true

instruments:
  # US
  - {name: AAPL,  sec_type: STK, symbol: AAPL,  exchange: SMART, currency: USD, primary_exchange: NASDAQ}
  - {name: AMZN,  sec_type: STK, symbol: AMZN,  exchange: SMART, currency: USD, primary_exchange: NASDAQ}
